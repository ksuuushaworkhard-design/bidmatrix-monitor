name: BidMatrix Market Brief

permissions:
  contents: read
  actions: read

concurrency:
  group: bidmatrix-market-brief-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'delivery' }}
  cancel-in-progress: false

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
  schedule:
    - cron: '7 6 * * *'
    - cron: '0 14 * * 5'

jobs:
  market-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .

      - name: Restore delivery state
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports /tmp/bidmatrix-delivery-state
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            if gh run download "$run_id" --name "delivery-state-$run_id" --dir /tmp/bidmatrix-delivery-state; then
              state_file="$(find /tmp/bidmatrix-delivery-state -type f -name delivery-state.json -print -quit)"
              if [ -n "$state_file" ]; then cp "$state_file" reports/delivery-state.json; break; fi
            fi
          done < <(gh run list --workflow market-brief.yml --branch main --status success --limit 10 --json databaseId --jq '.[].databaseId')

      - name: Run pull request checks
        if: ${{ github.event_name == 'pull_request' }}
        run: pytest

      - name: Run daily brief
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '7 6 * * *' || github.event_name == 'workflow_dispatch' && inputs.mode == 'daily' }}
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIDMATRIX_DELIVERY_ENABLED: 'true'
          BIDMATRIX_DELIVERY_CHANNEL: telegram
        run: bidmatrix-monitor

      - name: Run weekly brief
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 14 * * 5' || github.event_name == 'workflow_dispatch' && inputs.mode == 'weekly' }}
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIDMATRIX_DELIVERY_ENABLED: 'true'
          BIDMATRIX_DELIVERY_CHANNEL: telegram
        run: bidmatrix-monitor --weekly

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore

      - name: Upload delivery state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-state-${{ github.run_id }}
          path: reports/delivery-state.json
          if-no-files-found: ignore
          retention-days: 30
