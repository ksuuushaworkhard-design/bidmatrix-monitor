name: BidMatrix Weekly Email

concurrency:
  group: bidmatrix-weekly-email
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Start at 07:47 Moscow time on Mondays to leave room for GitHub scheduler delays.
    - cron: '47 4 * * 1'

jobs:
  weekly-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      SUBSCRIBER_SYNC_ENABLED: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .

      - name: Run pull request checks
        if: ${{ github.event_name == 'pull_request' }}
        run: pytest

      - name: Sync newsletter subscribers
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.SUBSCRIBER_SYNC_ENABLED == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SUBSCRIBER_RANGE: ${{ secrets.GOOGLE_SHEETS_SUBSCRIBER_RANGE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEEKLY_EMAIL_SEGMENT_ID: ${{ secrets.WEEKLY_EMAIL_SEGMENT_ID }}
        run: python -m bidmatrix_monitor.subscriber_sync

      - name: Restore recent daily report cache
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports /tmp/bidmatrix-daily-reports
          restored=0
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            run_dir="/tmp/bidmatrix-daily-reports/$run_id"
            mkdir -p "$run_dir"
            if gh run download "$run_id" --name "reports-$run_id" --dir "$run_dir"; then
              while IFS= read -r report; do
                cp "$report" reports/
                restored=$((restored + 1))
              done < <(find "$run_dir" -type f -name 'bidmatrix-monitor-*-curated.json')
            fi
          done < <(gh run list --workflow market-brief.yml --branch main --status success --limit 8 --json databaseId --jq '.[].databaseId')
          echo "WEEKLY_EMAIL_REPORT_CACHE_RESTORED files=$restored"

      - name: Send weekly email
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEEKLY_EMAIL_FROM: ${{ secrets.WEEKLY_EMAIL_FROM }}
          WEEKLY_EMAIL_REPLY_TO: ${{ secrets.WEEKLY_EMAIL_REPLY_TO }}
          WEEKLY_EMAIL_SEGMENT_ID: ${{ secrets.WEEKLY_EMAIL_SEGMENT_ID }}
          WEEKLY_EMAIL_TO: ${{ secrets.WEEKLY_EMAIL_TO || secrets.WEEKLY_EMAIL_TEST_TO }}
          WEEKLY_EMAIL_PUBLIC_LAUNCH: 'true'
          WEEKLY_EMAIL_REQUIRE_APPROVAL: 'true'
          WEEKLY_EMAIL_APPROVED: ${{ secrets.WEEKLY_EMAIL_APPROVED }}
          WEEKLY_EMAIL_PUBLIC_INTRO_DATE: ${{ secrets.WEEKLY_EMAIL_PUBLIC_INTRO_DATE }}
        run: bidmatrix-monitor --weekly-email-test-run --weekly-email-refresh-source-report

      - name: Upload email reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-email-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-email-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
