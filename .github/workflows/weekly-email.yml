name: BidMatrix Weekly Email

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Start at 11:47 Moscow time on Mondays to avoid GitHub's top-of-hour queue.
    - cron: '47 8 * * 1'

jobs:
  weekly-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .

      - name: Run pull request checks
        if: ${{ github.event_name == 'pull_request' }}
        run: pytest

      - name: Send weekly email
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEEKLY_EMAIL_FROM: ${{ secrets.WEEKLY_EMAIL_FROM }}
          WEEKLY_EMAIL_TO: ${{ secrets.WEEKLY_EMAIL_TO || secrets.WEEKLY_EMAIL_TEST_TO }}
        run: bidmatrix-monitor --weekly-email-test-run --weekly-email-refresh-source-report

      - name: Upload email reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-email-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-email-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
